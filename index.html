<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기홍's Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="logo" aria-label="기홍's Home">
    <span>기</span><span>홍</span><span>'</span><span>s</span><span class="gap">H</span><span>o</span><span>m</span><span>e</span>
  </h1>

  <form class="search" id="searchForm" role="search" autocomplete="off">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="#9aa0a6" stroke-width="2" />
        <path d="M16.5 16.5L21 21" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round" />
      </svg>
      <input id="query" name="q" type="text" placeholder="Google에서 검색" aria-label="Google 검색" autofocus />
      <button class="mic" type="button" title="음성 검색" aria-label="음성 검색">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 15Z" fill="#4285f4" />
          <path d="M18 11.5a6 6 0 0 1-12 0" stroke="#ea4335" stroke-width="1.8" fill="none" stroke-linecap="round" />
          <path d="M12 17.5V21" stroke="#34a853" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <div class="buttons">
      <button type="submit">Google 검색</button>
      <button type="button" id="luckyBtn">I'm Feeling Lucky</button>
    </div>
  </form>

  <section class="weather" id="weather" aria-label="오늘의 날씨">
    <article class="card" data-city="seoul">
      <div class="card-head"><span class="city">서울</span><span class="icon">⏳</span></div>
      <div class="temp"><span class="value">–</span><span class="unit">°</span></div>
      <div class="desc">불러오는 중…</div>
      <div class="range"></div>
    </article>
    <article class="card" data-city="jeju">
      <div class="card-head"><span class="city">제주</span><span class="icon">⏳</span></div>
      <div class="temp"><span class="value">–</span><span class="unit">°</span></div>
      <div class="desc">불러오는 중…</div>
      <div class="range"></div>
    </article>
  </section>
  <div class="updated" id="updated"></div>

  <section class="quote" aria-label="오늘의 명언">
    <p id="quoteText">명언을 불러오는 중…</p>
    <footer id="quoteAuthor"></footer>
    <button type="button" id="newQuote">다른 명언 보기</button>
  </section>

  <footer class="page">날씨 제공: Open-Meteo</footer>

  <script src="app.js"></script>
</body>
</html>
